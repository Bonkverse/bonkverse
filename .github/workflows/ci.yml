# CI for the Bonkverse Django repo (RFC-0001, "Testing and CI/CD").
# lint -> tests on Postgres -> migrations check -> security scan -> production image build.
# Branch protection on main requires all four jobs; Railway deploys only a green main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13" # keep in step with the Dockerfile base image
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff==0.17.3
      - name: ruff lint
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bonkverse
          POSTGRES_USER: postgres
          # Throwaway CI database, reachable only from this job: no password needed.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENV: ci
      SECRET_KEY: ci-only-not-a-secret
      DATABASE_URL: postgresql://postgres@localhost:5432/bonkverse
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: System libraries for CairoSVG
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2
      - run: pip install -r requirements-dev.txt
      - name: Migrations are in sync with models
        run: python manage.py makemigrations --check --dry-run
      - name: pytest
        run: pytest --create-db --cov --cov-report=term-missing:skip-covered

  security:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-not-a-secret-but-long-enough-for-check-deploy-0123456789
      DATABASE_URL: postgresql://unused@localhost/unused
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: System libraries for CairoSVG
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2
      - run: pip install -r requirements-dev.txt
      - name: Dependency vulnerabilities
        run: pip-audit -r requirements.txt
      - name: bandit (new medium+ findings only)
        # .bandit-baseline.json holds findings that existed when CI was added.
        run: bandit -q -r skins bonk_skin_search core integrations -x skins/migrations -ll -ii -b .bandit-baseline.json
      - name: Django deploy checks
        # Fails on errors. The HSTS / SSL-redirect warnings are tracked for Phase 1.
        run: ENV=production python manage.py check --deploy --fail-level ERROR

  docker:
    # Builds the exact image Railway deploys, so a broken Dockerfile or a vulnerable
    # package that only appears in production fails here instead of on deploy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: docker build -t bonkverse:ci .
      - name: Django system checks inside the image
        run: >-
          docker run --rm
          -e SECRET_KEY=ci-only-not-a-secret
          -e DATABASE_URL=postgresql://unused@localhost/unused
          -e REDIS_URL=redis://localhost:6379/0
          bonkverse:ci python manage.py check
      - name: The Celery worker can load its Redis transport inside the image
        # Opens no connection: building it resolves the transport, which is
        # where a missing dependency crashed the first worker deploy.
        run: >-
          docker run --rm
          -e SECRET_KEY=ci-only-not-a-secret
          -e DATABASE_URL=postgresql://unused@localhost/unused
          -e REDIS_URL=redis://localhost:6379/0
          -e DJANGO_SETTINGS_MODULE=bonk_skin_search.settings
          bonkverse:ci python -c
          "import django; django.setup();
          from bonk_skin_search.celery_app import app;
          app.connection_for_read(); app.loader.import_default_modules();
          print('celery ok:', sorted(t for t in app.tasks if not t.startswith('celery.')))"
      - name: Audit packages actually installed in the image
        run: docker run --rm bonkverse:ci sh -c "pip install -q pip-audit && pip-audit"
