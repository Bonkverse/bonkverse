# Weekly dependency update PRs (RFC-0001). CI must pass before merging.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns: ["pytest*", "ruff", "factory_boy", "responses", "pre-commit", "pip-audit", "bandit"]
    ignore:
      # Major versions of packages only used by hand-run tools (CSV restore
      # commands, scripts/label_skins.py): upgrade them when that tool is next
      # used and can be checked, not on Dependabot's schedule.
      - dependency-name: "pandas"
        update-types: ["version-update:semver-major"]
      - dependency-name: "openai"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
