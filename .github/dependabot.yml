# Weekly dependency update PRs (RFC-0001). CI must pass before merging.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns: ["pytest*", "ruff", "factory_boy", "responses", "pre-commit", "pip-audit", "bandit"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
