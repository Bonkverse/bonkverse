{% comment %}Table for a skin board: rows are skins with their count as `value` (skins.selectors.top_skins).{% endcomment %}<table class="leaderboard-table">
    <thead>
      <tr>
        <th>Rank</th>
        <th>Avatar</th>
        <th>Skin</th>
        <th>Creator</th>
        <th>{{ board.column }}</th>
      </tr>
    </thead>
    <tbody>
      {% for skin in rows %}
      <tr>
        <td>#{{ forloop.counter }}</td>
        <td><img src="{{ skin.image_url }}" alt="{{ skin.name }}'s Avatar" class="skin-avatar" data-zoom></td>
        <td><a href="{{ skin.get_absolute_url }}" class="skin-link">{{ skin.name }}</a></td>
        <td>{{ skin.creator }}</td>
        <td>{{ skin.value }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
