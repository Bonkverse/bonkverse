{% extends 'skins/base.html' %}
{% load static %}

{% block content %}
<div class="tool-wrap">
  <header class="tool-head">
    <h1 class="tool-title">Map Decoder</h1>
    <p class="tool-sub">Paste a Bonk map encoded string and decode it into JSON.</p>
  </header>

  <section class="tool-card">
    <div class="field">
      <div class="field-label-row">
        <label class="field-label" for="encoded">Encoded Map String</label>
        <button type="button" id="clearBtn" class="btn btn-ghost" title="Clear">Clear</button>
      </div>

      <!-- single-line input -->
      <input
        id="encoded"
        class="tool-input"
        type="text"
        placeholder="Paste encoded map string here..."
        spellcheck="false"
        autocomplete="off"
      />
      <div class="hint">Tip: click inside the input and press ⌘A / Ctrl+A to select everything.</div>
    </div>

    <div class="actions">
      <button id="decodeBtn" class="btn btn-primary" type="button" data-decode-url="{% url 'api_map_decode' %}">Decode</button>

      <!-- optional: keep status for decode state only (not copy) -->
      <span id="status" class="status-pill">Idle</span>

      <div class="spacer"></div>

    </div>

    <div id="summary" class="summary"></div>
    <div id="err" class="tool-error" role="alert"></div>

    <div class="out-card">
      <div class="out-head">
        <div class="out-title">Decoded Map JSON</div>

        <!-- copy icon + feedback -->
        <button id="copyIcon" class="icon-btn" type="button" disabled aria-label="Copy JSON">
          <span class="icon-default" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M8 8V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-2"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M6 8h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2Z"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </span>

          <span class="icon-copied" aria-hidden="true">
            <!-- check icon -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M20 6 9 17l-5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>

          <span class="copy-text">Copy</span>
        </button>
      </div>

      <pre id="out" class="out-pre">{}</pre>
    </div>
  </section>
</div>

{% endblock %}

{% block extra_scripts %}
<script src="{% static 'site_pages/js/map_decoder.js' %}"></script>
{% endblock %}
