{% extends "skins/base.html" %}
{% load static %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'css/flash_friends.css' %}">
{% endblock %}

{% block content %}
<h1>Find Flash Friends</h1>
<h2>Total Flash Friends in DB: <strong>{{ total_flash }}</strong></h2>

<div id="loading" hidden>Searching…</div>

<!-- Unified search UI -->
<div class="hero-inner">
  <div class="search-row">

    <!-- Same neon search bar as skin search -->
    <form id="flash-search-form" data-role="search-form" class="hero-search">
      <input
        type="text"
        id="flash-query" data-role="query"
        placeholder="Search flash friends..."
        autocomplete="off"
      />
      <button type="submit">Search</button>
    </form>

  </div>
</div>

<section class="skins-container" id="flash-results" data-role="results"></section>
<div id="flash-pagination" data-role="pagination"></div>

<div id="route-refs" data-kind="flash" data-search-url="{% url 'flash_friends_search' %}"></div>


{% endblock %}

{% block extra_scripts %}
<script src="{% static 'js/player_search.js' %}"></script>
{% endblock %}
