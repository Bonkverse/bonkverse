{% extends "skins/base.html" %}
{% load static %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'css/players.css' %}">
{% endblock %}

{% block content %}
<h1>Find Bonk Players</h1>
<h2>Total Bonk Players in database: <strong>{{ total_players }}</strong></h2>

<div id="loading" hidden>Searching…</div>

<div class="hero-inner">
  <div class="search-row">

    <!-- MAIN SEARCH BAR -->
    <form id="player-search-form" data-role="search-form" class="hero-search">
      <input
        type="text"
        id="player-query" data-role="query"
        placeholder="Search players..."
        autocomplete="off"
      />
      <button type="submit">Search</button>
    </form>

    <!-- SEARCH BY CONTROLS -->
    <div class="search-controls-inline">
      <label>Search By:</label>
      <select id="player-mode" data-role="mode">
        <option value="username">Username</option>
        <option value="id">Bonk ID</option>
      </select>
    </div>

  </div>
</div>

<section class="skins-container" id="results" data-role="results"></section>
<div id="pagination" data-role="pagination"></div>

<div id="route-refs" data-kind="players" data-search-url="{% url 'players_search' %}"></div>

{% endblock %}

{% block extra_scripts %}
<script src="{% static 'js/player_search.js' %}"></script>
{% endblock %}
