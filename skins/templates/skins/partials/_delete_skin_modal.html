<!-- Delete confirmation modal (handles both single-skin and bulk delete) -->
<div class="modal-overlay" id="delete-modal">
  <div class="modal-box" style="max-width: 400px;">
    <div class="modal-header">
      <h2 class="modal-title" id="delete-modal-title">Delete Skin</h2>
      <button class="modal-close-btn" id="delete-modal-close">
        <i data-lucide="x"></i>
      </button>
    </div>
    <div class="modal-body">
      <p id="delete-modal-body">Are you sure? This cannot be undone.</p>
    </div>
    <div class="modal-footer">
      <button class="modal-btn modal-btn-ghost" id="delete-cancel-btn">Cancel</button>
      <button class="modal-btn modal-btn-danger" id="delete-confirm-btn">Delete</button>
    </div>
  </div>
</div>
